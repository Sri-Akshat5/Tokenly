services:
  db:
    image: mysql:8.0
    container_name: tokenly-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tokenly_db}
      MYSQL_USER: ${MYSQL_USER:-tokenly}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tokenly_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - tokenly_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache:
    image: redis:7-alpine
    container_name: tokenly-cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: tokenly-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-tokenly_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-tokenly}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-tokenly_password}
      SPRING_DATA_REDIS_HOST: cache
      SPRING_DATA_REDIS_PORT: 6379
      SECURITY_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # .env.example ships placeholder mail credentials, which would make the
      # mail health indicator (and therefore the whole /actuator/health
      # response below) report DOWN out of the box. Excluded from the overall
      # health status by default so the healthcheck reflects the app, not an
      # unconfigured mail account; set to true once real credentials are set.
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
      APP_URL_BASE_BACKEND: ${BACKEND_URL:-http://localhost:8084}
      APP_URL_BASE_FRONTEND: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8084}:8084"
    # Without this, `depends_on` below only waits for the container process to
    # start, not for Spring Boot to finish initializing - so frontend could
    # start serving traffic before the backend can actually answer requests.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8084}
    container_name: tokenly-frontend
    restart: unless-stopped
    depends_on:
      backend:
        # Wait for the backend's healthcheck (not just container start) so
        # the frontend doesn't come up before the API can serve requests.
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  tokenly_mysql_data:
