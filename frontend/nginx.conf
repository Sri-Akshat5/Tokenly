server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Missing hashed build assets (e.g. after a stale index.html references an
    # old chunk) should 404, not fall back to index.html - otherwise the
    # browser gets HTML where it expected JS/CSS and fails with a confusing
    # parse error instead of a clear 404.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
