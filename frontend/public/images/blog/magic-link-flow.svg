<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#09090B"/>
  
  <text x="600" y="80" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="32" font-weight="700">Magic Link Authentication Flow</text>
  <text x="600" y="115" text-anchor="middle" fill="#71717A" font-family="Inter, sans-serif" font-size="18">Passwordless login via secure email links</text>

  <!-- Step 1 -->
  <rect x="50" y="250" width="180" height="200" rx="16" fill="#18181B" stroke="#27272A" stroke-width="2"/>
  <text x="140" y="480" text-anchor="middle" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="14">1. Enter Email</text>
  <rect x="80" y="320" width="120" height="24" rx="4" fill="#27272A"/>
  <text x="140" y="336" text-anchor="middle" fill="#71717A" font-family="Inter, sans-serif" font-size="10">user@example.com</text>
  <rect x="80" y="360" width="120" height="24" rx="4" fill="#3B82F6"/>
  <text x="140" y="376" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="10" font-weight="600">Send Link</text>

  <!-- Step 2 -->
  <rect x="300" y="250" width="180" height="200" rx="16" fill="#18181B" stroke="#3B82F6" stroke-width="2"/>
  <text x="390" y="480" text-anchor="middle" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="14">2. Tokenly API</text>
  <path d="M360 350L390 380L420 320" stroke="#3B82F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <rect x="550" y="250" width="180" height="200" rx="16" fill="#18181B" stroke="#8B5CF6" stroke-width="2"/>
  <text x="640" y="480" text-anchor="middle" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="14">3. Receive Email</text>
  <rect x="580" y="310" width="120" height="80" rx="8" fill="#5B21B6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1"/>
  <path d="M590 330H690" stroke="#8B5CF6" stroke-width="1"/>
  <rect x="610" y="355" width="60" height="15" rx="4" fill="#8B5CF6"/>

  <!-- Step 4 -->
  <rect x="800" y="250" width="180" height="200" rx="16" fill="#18181B" stroke="#10B981" stroke-width="2"/>
  <text x="890" y="480" text-anchor="middle" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="14">4. Click &amp; Auth</text>
  <circle cx="890" cy="350" r="30" fill="#064E3B" fill-opacity="0.2" stroke="#10B981" stroke-width="1"/>
  <path d="M880 350L890 360L910 335" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 5 -->
  <rect x="1000" y="250" width="150" height="200" rx="16" fill="#18181B" stroke="#F59E0B" stroke-width="2"/>
  <text x="1075" y="480" text-anchor="middle" fill="#A1A1AA" font-family="Inter, sans-serif" font-size="14">5. JWT Issued</text>
  <rect x="1025" y="335" width="100" height="30" rx="4" fill="#78350F" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1"/>
  <text x="1075" y="354" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="10">JWT Token</text>

  <!-- Connectors -->
  <path d="M230 350H300" stroke="#27272A" stroke-width="2"/>
  <path d="M480 350H550" stroke="#27272A" stroke-width="2"/>
  <path d="M730 350H800" stroke="#27272A" stroke-width="2"/>
  <path d="M980 350H1000" stroke="#27272A" stroke-width="2"/>
</svg>
