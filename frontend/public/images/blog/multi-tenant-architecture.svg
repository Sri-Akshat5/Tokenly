<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="675" fill="#09090B"/>
  
  <text x="600" y="80" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="32" font-weight="700">Multi-Tenant Isolation Architecture</text>
  <text x="600" y="115" text-anchor="middle" fill="#71717A" font-family="Inter, sans-serif" font-size="18">Securely managing multiple applications in one platform</text>

  <!-- Tenant A -->
  <rect x="150" y="200" width="280" height="350" rx="24" fill="#18181B" stroke="#3B82F6" stroke-width="2"/>
