  <rect x="490" y="340" width="220" height="40" rx="8" fill="#8B5CF6" fill-opacity="0.1" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="600" y="365" text-anchor="middle" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="14">Custom Policies</text>
  <rect x="490" y="400" width="220" height="80" rx="8" fill="#27272A"/>
  <text x="600" y="435" text-anchor="middle" fill="#71717A" font-family="monospace" font-size="12">tk_live_app_b_key</text>

