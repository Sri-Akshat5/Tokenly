  <rect x="180" y="400" width="220" height="80" rx="8" fill="#27272A"/>
  <text x="290" y="435" text-anchor="middle" fill="#71717A" font-family="monospace" font-size="12">tk_live_app_a_key</text>

  <!-- Tenant B -->
  <rect x="460" y="200" width="280" height="350" rx="24" fill="#18181B" stroke="#8B5CF6" stroke-width="2"/>
